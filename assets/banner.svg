<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Problem Solver. Results Driven.</title>
  <desc id="desc">Turning complex challenges into practical, working solutions. Software engineering, motorsports technology, C# and .NET, data and AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1f3a"/><stop offset="1" stop-color="#16345c"/></linearGradient>
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#ffffff"/><rect x="12" y="12" width="12" height="12" fill="#ffffff"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="flagmask"><rect x="840" width="360" height="300" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect x="840" width="360" height="300" fill="url(#checker)" opacity="0.10" mask="url(#flagmask)"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="64" y="43" width="238" height="30" rx="4" fill="#f2a900"/>
    <text x="183" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#0b1f3a" letter-spacing="1.2">SOFTWARE ENGINEERING</text>
    <text x="62" y="143" font-size="54" font-weight="800" fill="#ffffff">Problem Solver. Results Driven.</text>
    <text x="64" y="192" font-size="25" fill="#d6e2f2">Turning complex challenges into practical, working solutions.</text>
    <text x="64" y="231" font-size="19" font-weight="600" fill="#9ec5f8">MOTORSPORTS TECHNOLOGY  ·  ENTERPRISE APPLICATIONS  ·  DATA &amp; AI</text>
  </g>
  <rect y="252" width="1200" height="6" fill="#f2a900"/>
  <rect y="262" width="1200" height="2" fill="#f2a900" opacity="0.55"/>
  <text x="64" y="288" font-family="'Consolas', 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#9ec5f8">C# / .NET  ·  BLAZOR  ·  SQL SERVER  ·  PYTHON  ·  AWS / AZURE  ·  PARQUET / MCP</text>
